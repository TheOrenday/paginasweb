<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>ONE PIECE STORE</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>ONE PIECE STORE</h1>
        <ul id="catalogo"></ul>
        <p id="total">Total: $0</p>
        <ul id="ticket"></ul>
    <script>
        const productos = [
            { nombre: "Sombrero de paja", precio: 500},
            { nombre: "Climatak", precio: 350},
            { nombre: "Resortera", precio: 100},
        ];
        let total = 0;
        let carrito = [];
        const catalogo = document.getElementById("catalogo");
        const textoTotal = document.getElementById("total");

        for (const p of productos) {
            const li = document.createElement("li");
            li.textContent = p.nombre + " - $" + p.precio + " ";

            const boton = document.createElement("button");
            boton.textContent = "Agregar";
            boton.addEventListener("click", function (){
                total = total + p.precio;
                textoTotal.textContent = "Total: $" + total;
                agregarItem(p);
                mostrarticket();
            });
            li.appendChild(boton);
            catalogo.appendChild(li);
        }
        const botoncobrar = document.createElement("button");
        botoncobrar.textContent = "Cobrar";
        botoncobrar.addEventListener("click", function(){
            if (total === 0){
                return;
            }
            textoTotal.textContent = "Cobrado: $" + total;
            total = 0;
            carrito = [];
            mostrarticket();
        })
        document.body.appendChild(botoncobrar);

        
        function mostrarticket() {
            const listaticket = document.getElementById("ticket")
            listaticket.innerHTML = "";
            for (const item of carrito) {
                const li = document.createElement("li");
                li.textContent = item.nombre + " x" + item.cantidad + " - $" + (item.precio * item.cantidad);
                listaticket.appendChild(li);
            }
        }
        const botonQuitar = document.createElement("button");
        botonQuitar.textContent = "Quitar";
            botonQuitar.addEventListener("click", function () {
                if (carrito.length === 0) {
                return;
             }
                const ultimo = carrito[carrito.length - 1];
                total = total - ultimo.precio;

                    if (ultimo.cantidad > 1) {
                     ultimo.cantidad = ultimo.cantidad - 1;
             } else {
                    carrito.pop();
            }

    textoTotal.textContent = "Total: $" + total;
    mostrarticket();
});
            document.body.appendChild(botonQuitar);

            function agregarItem(producto) {
    const existente = carrito.find(function (x) {
        return x.nombre === producto.nombre;
    });

    if (existente) {
        existente.cantidad = existente.cantidad + 1;
    } else {
        carrito.push({ nombre: producto.nombre, precio: producto.precio, cantidad: 1 });
    }
}
    </script>
    </body>

</html>
